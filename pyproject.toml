[project]
name = "junnx"
version = "0.1.0"
description = ""
authors = [
    {name = "william cowley",email = "william.cowley01@gmail.com"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "jax (>=0.5,<0.6)",
    "equinox (>=0.13.2,<0.14.0)",
    "tensorflow-probability (>=0.25.0,<0.26.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "numpy (<2.1)",
    "tensorboardx (>=2.6.5,<3.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "setuptools (==81.0.0)",
]

[tool.poetry]
packages = [{include = "junnx", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "optax (>=0.2.8,<0.3.0)",
]
dev = [
    "black (>=25.12.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "ruff (>=0.14.13,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-jupyter (>=0.25.1,<0.26.0)",
    "mkdocstrings[python] (>=1.0.1,<2.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]
cuda = [
    "jax[cuda12] (>=0.5,<0.6)"
]
data = [
    "scikit-learn (<1.8)",
    "tensorflow-cpu (>=2.21.0,<3.0.0)",
    "tensorflow-datasets (>=4.9.9,<5.0.0)"
]
experiments = [
    "hydra-core (>=1.3.2,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "optax (>=0.2.8,<0.3.0)",
    "hydra-ray-launcher (>=1.2.1,<2.0.0)"
]

[tool.black]
line-length = 95

[tool.isort]
profile = "black"
line_length = 95

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
omit = [
    "src/junnx/data/*.py"
]

[tool.taskipy.tasks]
test = "pytest --cov-report html --cov=junnx --durations 10 tests/"
format = "black . && isort ."
lint = "ruff check --fix"
mypy = "mypy ."
