batch_size: 32
key_dl:
  _target_: jax.random.PRNGKey
  seed: 0
key_train:
  _target_: jax.random.PRNGKey
  seed: 20260411

defaults:
  - ds: make_moons
  - likelihood: categorical
  - net: stochastic_mlp
  - prior: dirichlet_2
  - sampler: uniform
  - variational: dirichlet
  - trainer: default
  - override trainer/metrics: classification_default
  - _self_

net:
  n_in: 2
  n_out: 2
  n_hidden: 32

trainer:
  n_epochs: 4_000

sampler:
  n_dim: 2
  n_samples: 64
  low: [-4.0, -4.0]
  high: [4.0, 4.0]

hydra:
  sweep:
    dir: ${oc.env:EXPERIMENTS_DIR}/classification2d/sweeps/${now:%Y%m%d_%H%M%S}

  run:
    dir: ${oc.env:EXPERIMENTS_DIR}/classification2d/out/${now:%Y%m%d_%H%M%S}